<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get in Touch — Storm43 Creative Media</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --brand:#4CAF50;--brand-dark:#388E3C;--text:#1a1a1a;--muted:#666;
    --border:#e0e0e0;--bg:#f5f5f5;--surface:#fff;--red:#e53935;
    --shadow:0 2px 12px rgba(0,0,0,.08);--rl:12px
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border-radius:var(--rl);box-shadow:var(--shadow);width:100%;max-width:520px;overflow:hidden}
  .header{background:#000;padding:24px 32px;text-align:center}
  .logo{color:#fff;font-size:22px;font-weight:800;letter-spacing:-.5px}
  .logo span{color:var(--brand)}
  .tagline{color:#999;font-size:13px;margin-top:4px}
  .body{padding:32px}
  h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.5}
  .form-group{margin-bottom:18px}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:border .15s;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{resize:vertical;min-height:100px}
  .btn{width:100%;padding:14px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;margin-top:8px}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{background:#ccc;cursor:not-allowed}
  .success{display:none;text-align:center;padding:32px}
  .success-icon{font-size:48px;margin-bottom:16px}
  .success h2{font-size:20px;font-weight:700;margin-bottom:8px}
  .success p{color:var(--muted);font-size:14px;line-height:1.6}
  .error-msg{background:#fde8e8;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none}
  .req{color:var(--red)}
  .footer{text-align:center;padding:16px 32px 24px;color:var(--muted);font-size:12px}
</style>
</head>

        <option>Website</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>What do you need? <span class="req">*</span></label>
      <textarea id="lc-needs" placeholder="Tell us about your project — packaging design, branding, labels, etc."></textarea>
    </div>
    <button class="btn" id="submit-btn" onclick="submitLead()">Send Enquiry</button>
  </div>
  <div class="success" id="success-body">
    <div class="success-icon">✅</div>
    <h2>Thank you!</h2>
    <p>We've received your enquiry and will be in touch within 24 hours.<br><br>In the meantime, follow us on social media for our latest work.</p>
  </div>
  <div class="footer">storm43.co.za · design@storm43.co.za</div>
</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxMWtzHSaPW-YWCZoGqWQXOOaeltx_O145ZdejajF7jlfaRzgsvywrbRwBewokNbOzGsQ/exec';

function v(id){ return document.getElementById(id)?.value?.trim()||''; }
function showErr(msg){
  const el=document.getElementById('err-msg');
  el.textContent=msg;el.style.display='block';
  el.scrollIntoView({behavior:'smooth',block:'center'});
}

async function submitLead(){
  const name=v('lc-name'), email=v('lc-email'), source=v('lc-source'), needs=v('lc-needs');
  document.getElementById('err-msg').style.display='none';
  if(!name){showErr('Please enter your full name.');return;}
  if(!email||!email.includes('@')){showErr('Please enter a valid email address.');return;}
  if(!source){showErr('Please tell us how you heard about us.');return;}
  if(!needs){showErr('Please tell us what you need.');return;}

  const btn=document.getElementById('submit-btn');
  btn.textContent='Sending...';btn.disabled=true;

  const lead={
    id:'lead_'+Date.now(),
    name,email,
    company:v('lc-company'),
    phone:v('lc-phone'),
    source,needs,
    stage:'New',
    createdAt:new Date().toISOString(),
    fromCapturePage:true
  };

  try{
    await fetch(SHEETS_URL,{
      method:'POST',redirect:'follow',
      body:JSON.stringify({action:'saveLead',lead})
    });
    document.getElementById('form-body').style.display='none';
    document.getElementById('success-body').style.display='block';
  }catch(e){
    btn.textContent='Send Enquiry';btn.disabled=false;
    showErr('Something went wrong. Please try again or email us directly at design@storm43.co.za');
  }
}

// Allow Enter key to submit
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA')submitLead();
});
</script>
</body>
</html>
